name: Conventional Commits PR Title Check

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
    branches:
      - dev
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  validate-pr-title:
    name: Validate Conventional Commits Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title Format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
          requireScope: false
