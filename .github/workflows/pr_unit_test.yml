name: Pull Request Build & Unit Test Verification

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Gradle Unit Tests & Debug Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew app:testDebugUnitTest

      - name: Assemble Debug Build
        run: ./gradlew app:assembleDebug
