schema_version: "2.0"
rule_id: "RULE-C2-001"
id: "c2_threat_block"
name: "Known C2 Threat IP Block"
description: "Detects and blocks egress connection to known malicious C2 addresses"
severity: "HIGH"
category: "NETWORK"
enabled: true
engine_type: "signature"
target_source: "dns_query"
condition:
  target_ips:
    - "192.0.2.1"
    - "198.51.100.14"
  target_domains:
    - "malicious-c2.example.com"
action: "BLOCK"
