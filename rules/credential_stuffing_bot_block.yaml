schema_version: "2.0"
rule_id: "RULE-NET-008"
id: "credential_stuffing_bot_block"
name: "Credential Stuffing & Password Brute Force Bot Endpoint"
description: "Blocks connection attempts to automated credential stuffing and dictionary attack endpoints"
severity: "HIGH"
category: "NETWORK"
enabled: true
engine_type: "signature"
target_source: "dns_query"
condition:
  target_domains:
    - "bruteforce-botnet.cc"
    - "credential-stuffing-node.info"
action: "BLOCK"
