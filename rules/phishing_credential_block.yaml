id: "phishing_credential_block"
name: "Phishing & Credential Harvester Block"
description: "Prevents connection to malicious phishing portals harvesting user login credentials"
severity: "HIGH"
category: "NETWORK"
condition:
  target_domains:
    - "login-verify-account.phishing-portal.com"
    - "secure-banking-update.fake-auth.net"
    - "credential-harvest.scam-server.io"
action: "BLOCK"
