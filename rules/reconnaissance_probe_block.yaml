schema_version: "2.0"
rule_id: "RULE-SCAN-001"
id: "reconnaissance_probe_block"
name: "Reconnaissance & Network Probe Scanner Block"
description: "Blocks automated network scanners probing for open vulnerable endpoints"
severity: "HIGH"
category: "NETWORK"
enabled: true
engine_type: "behavioral"
target_source: "dns_query"
condition:
  max_subdomain_depth: 3
  max_entropy: 4.2
  target_domains:
    - "recon-probe.scanner-node.io"
    - "portscan.target-check.net"
action: "BLOCK"
