schema_version: "2.0"
rule_id: "RULE-PKG-001"
id: "rogue_package_alert"
name: "Suspicious Rogue Package Alert"
description: "Detects rogue software installers attempting sideload persistence"
severity: "CRITICAL"
category: "PACKAGE"
enabled: true
engine_type: "signature"
target_source: "http_payload"
condition:
  package_patterns:
    - ".*test\\.malware.*"
    - ".*rogue\\.installer.*"
action: "NOTIFY"
