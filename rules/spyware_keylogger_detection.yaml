schema_version: "2.0"
rule_id: "RULE-PKG-002"
id: "spyware_keylogger_detection"
name: "Spyware & Keylogger Package Detection"
description: "Flags unauthorized background keyloggers and telemetry stealers"
severity: "HIGH"
category: "PACKAGE"
enabled: true
engine_type: "signature"
target_source: "http_payload"
condition:
  package_patterns:
    - ".*stealer\\.keylog.*"
    - ".*hidden\\.spyware.*"
action: "NOTIFY"
