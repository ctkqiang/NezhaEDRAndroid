id: "spyware_keylogger_detection"
name: "Spyware & Keylogger Package Detection"
description: "Flags unauthorized background keyloggers and telemetry stealers"
severity: "HIGH"
category: "PACKAGE"
condition:
  package_patterns:
    - ".*stealer\\.keylog.*"
    - ".*hidden\\.spyware.*"
action: "NOTIFY"
